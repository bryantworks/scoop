name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Lint (swift-format)
        run: swift format lint --strict --recursive Package.swift Sources Tests
      - name: Build
        run: swift build
      # TEMP DIAGNOSTIC: locate the suite that hangs on GitHub runners.
      - name: Build tests
        run: swift build --build-tests
      - name: Test AppInfoTests
        timeout-minutes: 4
        continue-on-error: true
        run: swift test --skip-build --filter AppInfoTests
      - name: Test ReadingOrderTests
        timeout-minutes: 4
        continue-on-error: true
        run: swift test --skip-build --filter ReadingOrderTests
      - name: Test ScreencaptureServiceTests
        timeout-minutes: 4
        continue-on-error: true
        run: swift test --skip-build --filter ScreencaptureServiceTests
      - name: Test CaptureCoordinatorTests
        timeout-minutes: 4
        continue-on-error: true
        run: swift test --skip-build --filter CaptureCoordinatorTests
      - name: Test PasteboardWriterTests
        timeout-minutes: 4
        continue-on-error: true
        run: swift test --skip-build --filter PasteboardWriterTests
      - name: Test VisionTextRecognizerTests
        timeout-minutes: 4
        continue-on-error: true
        run: swift test --skip-build --filter VisionTextRecognizerTests
      - name: Shellcheck
        run: |
          brew install shellcheck
          shellcheck install.sh scripts/*.sh
      - name: Installer tests
        run: scripts/test-install.sh

  signed-build:
    # Secrets aren't available to PRs from forks; skip there.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Universal signed build
        run: scripts/release-build.sh
        env:
          VERSION: 0.0.0-ci.${{ github.run_number }}
          SIGNING_CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: TextGrab-ci-${{ github.run_number }}
          path: dist/TextGrab.zip*
