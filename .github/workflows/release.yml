name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 20
    environment: signing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be on main
        # A tag on an unmerged commit would otherwise become everyone's "latest" update.
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Tag a merged commit."
            exit 1
          fi
      - name: Test
        run: swift test
      - name: Universal signed build
        # Tag v1.2.3 → version 1.2.3 in Info.plist.
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/release-build.sh
        env:
          SIGNING_CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/TextGrab.zip dist/TextGrab.zip.sha256 \
            --title "scoop ${GITHUB_REF_NAME#v}" --generate-notes
